name: Community
# Обои сообщества. Сервер — Cloudflare Worker из папки community/ (адрес ниже).
# Каждые 15 минут: новые обои переезжают с сервера в релизы community-N этого репозитория
# (там места почти без ограничений, и GitHub открывается там, где Cloudflare плохо доступен),
# с GitHub убирается то, что удалил модератор, а в ветку community кладётся запасной список community.json.
# Сервер узнаёт этот репозиторий по OIDC-токену GitHub — секретов не нужно.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: community
  cancel-in-progress: false
env:
  API: https://podokonnik.aleksandrkrasnikov97.workers.dev
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Move new wallpapers to GitHub, remove deleted ones
        run: |
          set -e
          tok() { curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=podokonnik-community" | jq -r .value; }
          api() { curl -sf -H "Authorization: Bearer $(tok)" -H 'Content-Type: application/json' "$@"; }
          api "$API/api/sync/pending" > pending.json
          cat pending.json; echo
          rels() { gh api "repos/$REPO/releases?per_page=100" --paginate | jq -s 'add | map(select(.tag_name | startswith("community-")))' > rel.json; }
          rels
          pick() {   # релиз, где ещё есть место (до 1000 файлов в релизе)
            t=$(jq -r 'map(select((.assets | length) < 990)) | sort_by(.tag_name | ltrimstr("community-") | tonumber) | last | .tag_name // empty' rel.json)
            if [ -z "$t" ]; then
              n=$(jq -r 'map(.tag_name | ltrimstr("community-") | tonumber) | max // 0' rel.json); n=$((n + 1)); t="community-$n"
              gh release create "$t" --repo "$REPO" --prerelease --title "Обои сообщества $n" \
                --notes "Обои, которые выложили пользователи Подоконника. Смотреть и ставить — в программе: Живые обои → Сообщество." >/dev/null
              rels
            fi
            echo "$t"
          }
          for id in $(jq -r '.upload[]' pending.json); do
            curl -sfL "$API/f/$id.zip" -o "$id.zip" && curl -sfL "$API/f/$id.jpg" -o "$id.jpg" || { echo "skip $id"; continue; }
            t=$(pick)
            gh release upload "$t" "$id.zip" "$id.jpg" --repo "$REPO" --clobber
            base="https://github.com/$REPO/releases/download/$t"
            api -X POST -d "{\"id\":\"$id\",\"file\":\"$base/$id.zip\",\"preview\":\"$base/$id.jpg\"}" "$API/api/sync/done"; echo
            rm -f "$id.zip" "$id.jpg"
            rels
          done
          for id in $(jq -r '.purge[]' pending.json); do
            for t in $(jq -r --arg z "$id.zip" 'map(select(any(.assets[]; .name == $z))) | .[].tag_name' rel.json); do
              gh release delete-asset "$t" "$id.zip" --repo "$REPO" -y || true
              gh release delete-asset "$t" "$id.jpg" --repo "$REPO" -y || true
            done
            api -X POST -d "{\"id\":\"$id\"}" "$API/api/sync/purged"; echo
          done
          api "$API/api/sync/catalog" > community.json
      - name: Spare list for the app (branch community)
        run: |
          set -e
          mkdir out && cd out
          git init -q -b community
          cp ../community.json .
          git add community.json
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "community"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" community
